<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create account — Servio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="../assets/app.css" rel="stylesheet">
</head>

<body class="auth-page">

    <main class="auth-card">

        <a class="brand" href="../index.html">
            <span class="brand-mark">
                <i class="bi bi-chat-heart-fill"></i>
            </span>
            servio<span class="brand-dot">.</span>
        </a>

        <div class="mt-4 mb-4">
            <h2 class="fw-bold">Create your account</h2>
            <p class="muted">
                Let's get your AI waiter ready to welcome guests.
            </p>
        </div>

        <!-- Error Message -->
        <div id="authError" class="alert alert-danger auth-error"></div>

        <!-- Registration Form -->
        <form id="registerForm">

            <div class="mb-3">
                <label class="form-label fw-semibold">Your name</label>

                <input class="form-control" id="name" type="text" required autocomplete="name"
                    placeholder="Your full name">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email address</label>

                <input class="form-control" type="email" id="email" required autocomplete="email"
                    placeholder="you@restaurant.com">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>

                <input class="form-control" type="password" id="password" minlength="8" required
                    autocomplete="new-password" placeholder="At least 8 characters">
            </div>

            <button class="btn btn-primary w-100 rounded-pill py-3" id="registerBtn" type="submit">
                Create account
                <i class="bi bi-arrow-right ms-1"></i>
            </button>

        </form>

        <div class="text-center text-secondary small my-3">
            or
        </div>

        <!-- Google Registration -->
        <button id="googleBtn" class="google-btn" type="button">
            <i class="bi bi-google me-2"></i>
            Sign up with Google
        </button>

        <p class="text-center muted mt-4 mb-0">
            Already have an account?
            <a href="login.html" class="fw-semibold">Log in</a>
        </p>

    </main>


    <script type="module">

        import {
            auth,
            registerEmail,
            loginGoogle,
            onAuthStateChanged
        } from '../assets/auth.js';


        // Elements
        const err = document.getElementById('authError');

        const registerForm = document.getElementById('registerForm');

        const registerBtn = document.getElementById('registerBtn');

        const googleBtn = document.getElementById('googleBtn');


        // Show Error
        function showError(error) {

            err.textContent = error.message || 'Could not create account.';

            err.style.display = 'block';

        }


        // Hide Error
        function hideError() {

            err.textContent = '';

            err.style.display = 'none';

        }


        // Check Existing Login Session
        onAuthStateChanged(auth, user => {

            if (user) {

                location.replace('../dashboard/dashboard.html');

            }

        });


        // Email Registration
        registerForm.addEventListener('submit', async (e) => {

            e.preventDefault();

            hideError();


            // Get Input Elements
            const nameInput = document.getElementById('name');

            const emailInput = document.getElementById('email');

            const passwordInput = document.getElementById('password');


            // Get Values
            const nameValue = nameInput.value.trim();

            const emailValue = emailInput.value.trim();

            const passwordValue = passwordInput.value;


            // Validation
            if (!nameValue || !emailValue || !passwordValue) {

                showError({
                    message: 'Please fill in all required fields.'
                });

                return;

            }


            if (passwordValue.length < 8) {

                showError({
                    message: 'Password must contain at least 8 characters.'
                });

                return;

            }


            // Loading State
            registerBtn.disabled = true;

            registerBtn.innerHTML = 'Creating account…';


            try {

                // Firebase Registration
                await registerEmail(
                    nameValue,
                    emailValue,
                    passwordValue
                );


                // Redirect to Dashboard
                location.replace('../dashboard/dashboard.html');


            } catch (error) {

                console.error('Registration Error:', error);

                showError(error);


            } finally {

                registerBtn.disabled = false;

                registerBtn.innerHTML = 'Create account <i class="bi bi-arrow-right ms-1"></i>';

            }

        });


        // Google Registration
        googleBtn.addEventListener('click', async () => {

            hideError();

            googleBtn.disabled = true;

            googleBtn.innerHTML = 'Connecting to Google…';


            try {

                await loginGoogle();

                location.replace('../dashboard/dashboard.html');


            } catch (error) {

                console.error('Google Registration Error:', error);

                showError(error);


            } finally {

                googleBtn.disabled = false;

                googleBtn.innerHTML = '<i class="bi bi-google me-2"></i>Sign up with Google';

            }

        });

    </script>

</body>

</html>
