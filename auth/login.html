<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Servio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../assets/app.css" rel="stylesheet"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="../index.html"><span class="brand-mark"><i class="bi bi-chat-heart-fill"></i></span>servio<span class="brand-dot">.</span></a><div class="mt-4 mb-4"><h2 class="fw-bold">Welcome back</h2><p class="muted">Log in to manage your restaurant's AI waiter.</p></div><div id="authError" class="alert alert-danger auth-error"></div><form id="loginForm"><div class="mb-3"><label class="form-label fw-semibold">Email address</label><input class="form-control" type="email" id="email" required autocomplete="email" placeholder="you@restaurant.com"></div><div class="mb-3"><label class="form-label fw-semibold">Password</label><input class="form-control" type="password" id="password" required autocomplete="current-password" placeholder="Your password"></div><button class="btn btn-primary w-100 rounded-pill py-3" id="loginBtn">Log in <i class="bi bi-arrow-right ms-1"></i></button></form><div class="text-center text-secondary small my-3">or continue with</div><button id="googleBtn" class="google-btn"><i class="bi bi-google me-2"></i>Continue with Google</button><p class="text-center muted mt-4 mb-0">New to Servio? <a href="register.html" class="fw-semibold">Create an account</a></p></main><script type="module">
import {auth,loginEmail,loginGoogle,onAuthStateChanged} from '../assets/auth.js';const err=document.getElementById('authError');function show(e){err.textContent=e.code==='auth/invalid-credential'?'Email or password is incorrect.':e.message||'Something went wrong.';err.style.display='block'}onAuthStateChanged(auth,u=>{if(u)location.replace('../dashboard/dashboard.html')});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Signing in…';try{await loginEmail(email.value.trim(),password.value);location.replace('../dashboard/dashboard.html')}catch(x){show(x)}finally{b.disabled=false;b.innerHTML='Log in <i class="bi bi-arrow-right ms-1"></i>'}});document.getElementById('googleBtn').addEventListener('click',async()=>{try{await loginGoogle();location.replace('../dashboard/dashboard.html')}catch(x){show(x)}});
</script></body></html>
